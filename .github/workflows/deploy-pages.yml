name: Deploy Docs to GitHub Pages

# 只有 main 更新才发布文档站点；dev 及其他分支不触发 Pages。
# Only `main` publishes the docs site; `dev` and other branches do not.
on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发一次部署。
  # Allow manual one-off deployments from the Actions tab.
  workflow_dispatch:

# GitHub Pages 官方部署所需权限。
# Permissions required by the official GitHub Pages deployment flow.
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个 Pages 部署；不打断正在进行的发布。
# Keep a single in-flight Pages deployment; never cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        # 版本取自 package.json 的 packageManager 字段（pnpm@12.4.1），
        # 与本地开发环境保持一致；不再写死 version，避免与仓库配置漂移。
        # Version comes from the `packageManager` field in package.json
        # (pnpm@12.4.1), matching local development.
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # 不启用缓存：仓库未提交 pnpm-lock.yaml，缺少可哈希的 lockfile，
          # 而且 setup-node 对 pnpm 默认也不自动缓存。
          # Caching stays off: pnpm-lock.yaml is not committed, so there is no
          # lockfile to hash, and setup-node does not auto-cache pnpm.
          package-manager-cache: false

      - name: Install dependencies
        # pnpm-lock.yaml 未纳入版本控制，因此不能使用 --frozen-lockfile。
        # pnpm-lock.yaml is not tracked, so a frozen lockfile install would fail.
        run: pnpm install --no-frozen-lockfile

      - name: Build docs
        run: pnpm docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
